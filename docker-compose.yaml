services:
  api:
    container_name: smart-campus-backend
    image: smart-campus-backend:1.0

    build:
      # context: . la thu muc pham vi
      context: .
      dockerfile: dockerfile

    ports:
      - "8080:8000"

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exit 1" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
